log:
  level: INFO

providers:
  docker:
    exposedByDefault: false
    network: traefik
  file:
    directory: /etc/traefik/config
    watch: true

api:
  dashboard: true

entryPoints:
  http:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: https
          priority: 1000

  https:
    address: ":443"
    http:
      tls:
        certResolver: lets-encrypt

certificatesResolvers:
  lets-encrypt:
    acme:
      email: best@fredagscafeen.dk
      storage: acme.json
      dnsChallenge:
        provider: cloudflare
