services:
  traefik:
    container_name: traefik
    image: traefik:2.11
    restart: always
    ports:
      - 80:80
      - 443:443
    environment:
      - CLOUDFLARE_DNS_API_TOKEN=${TRAEFIK_CLOUDFLARE_DNS_API_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik.yml:/etc/traefik/traefik.yml
      - ./config:/etc/traefik/config
      - ./acme.json:/acme.json
    networks:
      - traefik

networks:
  traefik:
    name: traefik