services:
  traefik:
    container_name: traefik
    image: traefik:2.11
    restart: always
    ports:
      - 80:80
      - 443:443
    environment:
      - CLOUDFLARE_DNS_API_TOKEN=${TRAEFIK_CLOUDFLARE_DNS_API_TOKEN}
    labels:
      - traefik.enable=true

      - traefik.http.routers.api.rule=Host(`traefik.fredagscafeen.dk`)
      - traefik.http.routers.api.entrypoints=https
      - traefik.http.routers.api.service=api@internal
      - traefik.http.routers.api.middlewares=oauth2-proxy-auth
      - traefik.http.routers.api.tls=true
      - traefik.http.routers.api.tls.certresolver=lets-encrypt
      - traefik.http.services.api.loadbalancer.server.port=80
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik.yml:/etc/traefik/traefik.yml
      - ./config:/etc/traefik/config
      - ./acme.json:/acme.json
    networks:
      - traefik

networks:
  traefik:
    name: traefik